[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "local: usa recursos locales y gratuitos (libreria qrcode, PostgreSQL local)",
    "db: requiere la base PostgreSQL de pruebas (docker compose up -d)",
    "externa: toca internet (email real); fuera de la corrida normal",
]
